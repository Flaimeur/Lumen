<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a30"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d0fb"/>
      <stop offset="1" stop-color="#8f86e6"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="58" cy="60" r="32" fill="#fff"/>
      <circle cx="74" cy="50" r="28" fill="#000"/>
    </mask>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <circle cx="58" cy="60" r="32" fill="#AFA9EC" mask="url(#crescent)" filter="url(#glow)" opacity="0.55"/>
  <circle cx="58" cy="60" r="32" fill="url(#moon)" mask="url(#crescent)"/>
  <circle cx="84" cy="80" r="6" fill="#5DCAA5"/>
  <circle cx="96" cy="66" r="3.5" fill="#ED93B1"/>
  <circle cx="30" cy="30" r="2.5" fill="#F1EFE8"/>
</svg>
