<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' lumen-media: data:; media-src 'self' lumen-media: data: blob:; connect-src 'self' lumen-media:; frame-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Lumen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="no-cursor booting">
  <div id="boot" aria-hidden="true">
    <svg class="boot-mark" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="boot-moon-g" x1="0.1" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#e0dcff"/><stop offset="1" stop-color="#8b7cf0"/></linearGradient>
        <mask id="boot-crescent"><circle cx="54" cy="62" r="34" fill="#fff"/><circle cx="72" cy="50" r="29" fill="#000"/></mask>
      </defs>
      <g class="moon"><circle cx="54" cy="62" r="34" fill="url(#boot-moon-g)" mask="url(#boot-crescent)"/></g>
      <circle class="star s1" cx="76" cy="36" r="4.6" fill="#5eead4"/>
      <circle class="star s2" cx="88" cy="48" r="4.6" fill="#f472b6"/>
      <circle class="star s3" cx="76" cy="60" r="4.6" fill="#fbbf24"/>
      <circle class="star s4" cx="64" cy="48" r="4.6" fill="#60a5fa"/>
    </svg>
    <div class="boot-word">lumen</div>
  </div>
  <div id="bg" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="bg-layer"></div>
    <div class="bg-layer"></div>
    <div class="bg-shade"></div>
    <div class="grain"></div>
  </div>

  <header id="topbar">
    <div class="brand"><span class="logo-mark"></span><span>lumen</span><span id="profile-badge" hidden></span></div>
    <div id="title-pill" class="pill"></div>
    <button id="update-pill" class="pill" hidden title="Une nouvelle version de Lumen est prête"></button>
    <div class="status pill">
      <svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span id="clock"></span><span class="sep"></span><svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="date"></span><span id="battery"></span><span id="pad-battery" hidden></span>
    </div>
  </header>

  <main id="view"></main>

  <footer id="bottombar">
    <div class="hints" id="hints-left"></div>
    <nav id="dock"></nav>
    <div class="hints" id="hints-right"></div>
  </footer>

  <div id="overlay" hidden></div>
  <div id="toast" hidden></div>

  <script src="mock.js"></script>
  <script src="input.js"></script>
  <script src="glyphs.js"></script>
  <script src="arcade.js"></script>
  <script src="app.js"></script>
</body>
</html>
